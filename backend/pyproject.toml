[project]
name = "flight-match-simulator"
version = "0.1.0"
description = "Human-in-the-loop flight node clustering and matching simulator"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

